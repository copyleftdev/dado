<link rel="stylesheet" href="parts.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body data-view="loading">
<canvas id="stage" aria-label="The chosen part. Drag to turn it."></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels"></div>

<header class="top">
  <a class="brand" href="index.html#make" aria-label="Dado: back to the wall"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#joint"/></svg>dado</a>
  <nav class="tools">
    <a class="link" href="https://github.com/copyleftdev/dado">Specs on GitHub</a>
    <a class="link" id="toWall" href="index.html#make">The wall</a>
    <a class="button" id="toAll" href="#">All parts</a>
  </nav>
</header>

<main id="gallery">
  <div class="lead">
    <small>Act four · Every part</small>
    <h1>Every part.</h1>
    <p id="count">Loading the parts</p>
  </div>
  <div id="families"></div>
</main>

<section id="detail" aria-live="polite">
  <div class="about">
    <small id="family"></small>
    <h2 id="name"></h2>
    <p id="blurb"></p>
    <table id="facts"></table>
    <p class="files" id="files"></p>
  </div>
  <div class="bench" role="group" aria-label="How to look at it">
    <div class="ctl"><span>View</span><div class="row" id="views"></div></div>
    <div class="ctl"><span>Cut it open</span><div class="row" id="cuts"></div>
      <input id="depth" type="range" min="0" max="100" value="50" aria-label="How far to cut" hidden></div>
    <div class="ctl"><span>Show</span><div class="row"><button id="notes" type="button" aria-pressed="true">Notes</button><button id="edges" type="button" aria-pressed="true">Edges</button><button id="spin" type="button" aria-pressed="true">Turn</button><button id="pi" type="button" aria-pressed="true" hidden>The Pi</button><button id="fan" type="button" aria-pressed="true" hidden>The fan</button></div></div>
  </div>
  <nav class="step" aria-label="Other parts">
    <a id="prev" href="#"></a><a id="next" href="#"></a>
  </nav>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="joint" viewBox="0 0 24 24">
    <g fill="currentColor"><rect x="2" y="2" width="20" height="3"/><rect x="2" y="5" width="3" height="10"/><rect x="19" y="5" width="3" height="10"/><rect x="2" y="12" width="7.5" height="3"/><rect x="14.5" y="12" width="7.5" height="3"/></g>
    <g fill="var(--clay)"><rect x="6" y="7" width="12" height="3"/><rect x="10.5" y="10" width="3" height="9"/><rect x="2" y="19" width="20" height="3"/></g>
  </symbol>
</svg>
<script type="module" src="parts.js"></script>
</body>
</html>
